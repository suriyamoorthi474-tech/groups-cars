<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>{% block title %}{% endblock %} | {{ site.name }}</title>
<meta name="description" content="{% block desc %}{{ site.tagline }}{% endblock %}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cg fill='%232f3bff'%3E%3Ccircle cx='5' cy='5' r='2.4'/%3E%3Ccircle cx='12' cy='5' r='2.4'/%3E%3Ccircle cx='19' cy='5' r='2.4'/%3E%3Ccircle cx='12' cy='12' r='2.4'/%3E%3Ccircle cx='5' cy='19' r='2.4'/%3E%3Ccircle cx='12' cy='19' r='2.4'/%3E%3Ccircle cx='19' cy='19' r='2.4'/%3E%3C/g%3E%3C/svg%3E">
<script>(function(){try{var t=localStorage.getItem("ct-theme");if(t==="light"||t==="dark"){document.documentElement.setAttribute("data-theme",t);}}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root, html[data-theme="dark"] {
    color-scheme: dark;
    --bg:#0b0c10; --bg-2:#11131a; --card:#15171e; --card-2:#1d2029;
    --ink:#f4f2ed; --ink-2:#cfd2dc; --muted:#a0a4b2; --line:#2b2e3a; --line-2:#3d4152;
    --acc:#2f3bff; --acc-fill:#5a64ff; --acc-text:#98a1ff; --lime:#d7ff3f;
    --shadow-2:0 18px 44px -14px rgba(0,0,0,.8);
}
html[data-theme="light"] {
    color-scheme: light;
    --bg:#f4f2ed; --bg-2:#ebe8df; --card:#ffffff; --card-2:#efede6;
    --ink:#101114; --ink-2:#3a3d46; --muted:#5f626d; --line:#e4e1d8; --line-2:#cfcbbf;
    --acc:#2f3bff; --acc-fill:#2f3bff; --acc-text:#2029d6; --lime:#d7ff3f;
    --shadow-2:0 18px 40px -14px rgba(16,17,20,.35);
}
:root { --font:"Outfit",-apple-system,"Segoe UI",Arial,sans-serif; --r-card:28px; --r-pill:999px; --d-fast:150ms; --d-med:250ms; --ease:cubic-bezier(.2,.8,.2,1); }
* { margin:0; padding:0; box-sizing:border-box; font-family:var(--font); }
body { background:var(--bg); color:var(--ink); font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased; overflow-x:hidden; transition:background var(--d-med), color var(--d-med); }
a { color:inherit; }
:focus-visible { outline:3px solid var(--acc-text); outline-offset:2px; }
.wrap { width:min(1180px, 100% - 40px); margin:0 auto; }

header { position:sticky; top:0; z-index:100; background:var(--bg); border-bottom:1px solid var(--line); }
.bar { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; min-height:68px; gap:8px 16px; }
.brand { display:inline-flex; align-items:center; gap:10px; min-height:44px; font-size:24px; letter-spacing:-.045em; text-decoration:none; color:var(--ink); }
.brand .logo { width:26px; height:26px; flex:none; overflow:visible; }
.brand .logo circle { fill:var(--ink); }
.brand .logo circle.on { fill:var(--acc-fill); }
.brand .wm { line-height:1; } .brand .wm span { font-weight:300; } .brand .wm b { font-weight:800; }
.bar-right { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.bar nav { display:flex; flex-wrap:wrap; gap:2px; }
.bar nav a { text-decoration:none; color:var(--muted); font-weight:600; font-size:14.5px; min-height:44px; display:inline-flex; align-items:center; padding:0 14px; border-radius:var(--r-pill); }
.bar nav a:hover { color:var(--ink); background:var(--card-2); }
.bar nav a[aria-current] { color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--line-2); }
.icon-btn { width:44px; height:44px; display:grid; place-items:center; background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:50%; cursor:pointer; }
.icon-btn:hover { border-color:var(--ink); }
.icon-btn svg { width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
.icon-btn .i-sun { display:none; }
html[data-theme="light"] .icon-btn .i-sun { display:block; }
html[data-theme="light"] .icon-btn .i-moon { display:none; }

main { padding:48px 0 24px; }
.page { width:min(860px, 100% - 40px); margin:0 auto; }
.page .pill { display:inline-flex; align-items:center; min-height:30px; font-size:12px; font-weight:700; letter-spacing:.04em; color:#101114; background:var(--lime); padding:4px 14px; border-radius:var(--r-pill); margin-bottom:16px; }
h1 { font-size:clamp(34px,6vw,56px); line-height:1.02; font-weight:700; letter-spacing:-.05em; margin-bottom:10px; }
.updated { color:var(--muted); font-size:15px; margin-bottom:28px; }
.doc { background:var(--card); border:1px solid var(--line); border-radius:var(--r-card); padding:10px 36px 36px; }
.doc h2 { font-size:21px; font-weight:700; letter-spacing:-.03em; margin:30px 0 6px; }
.doc p, .doc li { color:var(--ink-2); font-size:16px; line-height:1.75; max-width:68ch; }
.doc ul { padding-left:22px; margin:8px 0; } .doc li { margin:5px 0; }
.doc a { color:var(--acc-text); }
.doc b { color:var(--ink); }
.note { border-left:4px solid var(--lime); background:var(--bg-2); padding:12px 16px; border-radius:0 14px 14px 0; margin-top:24px; }
@media (max-width:600px) { .doc { padding:2px 20px 26px; border-radius:22px; } .wrap, .page { width:calc(100% - 32px); } }

footer { border-top:1px solid var(--line); padding:52px 0 28px; margin-top:48px; }
.foot { display:flex; justify-content:space-between; align-items:flex-start; gap:28px; flex-wrap:wrap; padding-bottom:28px; border-bottom:1px solid var(--line); }
.tagline { color:var(--muted); font-size:14.5px; margin-top:4px; }
.copy { padding-top:22px; color:var(--muted); font-size:13px; text-align:center; }
@media (max-width:600px) { .foot { flex-direction:column; } }
@media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<header>
    <div class="wrap bar">
        <a href="{{ url_for('home') }}" class="brand" aria-label="{{ site.name }} home">
            <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="5" r="2.2"/><circle cx="12" cy="5" r="2.2"/><circle cx="19" cy="5" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="5" cy="19" r="2.2"/><circle cx="12" cy="19" r="2.2"/><circle class="on" cx="19" cy="19" r="2.2"/></svg>
            <span class="wm"><span>zi</span><b>vo</b></span>
        </a>
        <div class="bar-right">
            <nav aria-label="Pages">
                <a href="{{ url_for('home') }}">Home</a>
                <a href="{{ url_for('about_page') }}" {% if page=='about' %}aria-current="page"{% endif %}>About</a>
                <a href="{{ url_for('privacy_page') }}" {% if page=='privacy' %}aria-current="page"{% endif %}>Privacy</a>
                <a href="{{ url_for('terms_page') }}" {% if page=='terms' %}aria-current="page"{% endif %}>Terms</a>
                <a href="{{ url_for('copyright_page') }}" {% if page=='copyright' %}aria-current="page"{% endif %}>Copyright</a>
            </nav>
            <button type="button" class="icon-btn" id="themeBtn" aria-label="Switch theme">
                <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
                <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
        </div>
    </div>
</header>

<main>
    <div class="page">
        <span class="pill">{% block pill %}{{ site.name }}{% endblock %}</span>
        <h1>{% block heading %}{% endblock %}</h1>
        {% block updated %}<p class="updated">Last updated: {{ site.legal_updated }}</p>{% endblock %}
        <div class="doc">{% block content %}{% endblock %}</div>
    </div>
</main>

{% include "_footer.html" %}

<script>
document.getElementById("themeBtn").addEventListener("click", function () {
    var next = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("ct-theme", next); } catch (e) {}
});
</script>
</body>
</html>
