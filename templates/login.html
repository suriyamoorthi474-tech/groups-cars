<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0c10">
<meta name="color-scheme" content="dark light">
<title>Login | Zivo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cg fill='%232f3bff'%3E%3Ccircle cx='5' cy='5' r='2.4'/%3E%3Ccircle cx='12' cy='5' r='2.4'/%3E%3Ccircle cx='19' cy='5' r='2.4'/%3E%3Ccircle cx='12' cy='12' r='2.4'/%3E%3Ccircle cx='5' cy='19' r='2.4'/%3E%3Ccircle cx='12' cy='19' r='2.4'/%3E%3Ccircle cx='19' cy='19' r='2.4'/%3E%3C/g%3E%3C/svg%3E">
<script>(function(){try{var t=localStorage.getItem("ct-theme");if(t==="light"||t==="dark"){document.documentElement.setAttribute("data-theme",t);}}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root, html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0b0c10; --card: #15171e; --card-2: #1d2029;
    --ink: #f4f2ed; --ink-2: #cfd2dc; --muted: #a0a4b2;
    --line: #2b2e3a; --line-2: #3d4152;
    --acc: #2f3bff; --acc-fill: #5a64ff; --acc-text: #98a1ff;
    --lime: #d7ff3f;
    --hero: #d7ff3f; --on-hero: #101114;
    --panel: #1a1d2b; --on-panel: #ffffff;
    --success: #5be08f; --danger: #ff7b86;
}
html[data-theme="light"] {
    color-scheme: light;
    --bg: #f4f2ed; --card: #ffffff; --card-2: #efede6;
    --ink: #101114; --ink-2: #3a3d46; --muted: #5f626d;
    --line: #e4e1d8; --line-2: #cfcbbf;
    --acc: #2f3bff; --acc-fill: #2f3bff; --acc-text: #2029d6;
    --hero: #2f3bff; --on-hero: #ffffff;
    --panel: #101114; --on-panel: #ffffff;
    --success: #0b7a3b; --danger: #c4283a;
}
:root { --font: "Outfit", -apple-system, "Segoe UI", Arial, sans-serif; --ease: cubic-bezier(.2,.8,.2,1); }

* { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font); }
body { background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; min-height: 100vh; min-height: 100dvh; transition: background .25s, color .25s; }
a { color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--acc-text); outline-offset: 2px; }
button, a { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

/* logo */
.brand { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; font-size: 24px; letter-spacing: -.045em; text-decoration: none; color: var(--ink); }
.brand .logo { width: 26px; height: 26px; flex: none; overflow: visible; }
.brand .logo circle { fill: var(--ink); }
.brand .logo circle.on { fill: var(--acc-fill); }
.brand .wm { line-height: 1; }
.brand .wm span { font-weight: 300; }
.brand .wm b { font-weight: 800; }

.top { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 50%; cursor: pointer; transition: border-color .15s, transform .15s var(--ease); }
.icon-btn:hover { border-color: var(--ink); }
.icon-btn:active { transform: scale(.92); }
.icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn .i-sun { display: none; }
html[data-theme="light"] .icon-btn .i-sun { display: block; }
html[data-theme="light"] .icon-btn .i-moon { display: none; }

.shell { width: min(1080px, 100% - 32px); margin: 0 auto; padding: 8px 0 40px; display: grid; grid-template-columns: 1fr; gap: 20px; align-items: stretch; }

/* side panel (desktop only) */
.side { display: none; position: relative; overflow: hidden; background: var(--panel); color: var(--on-panel); border-radius: 36px; padding: 52px 44px; }
.side::after { content: ""; position: absolute; right: -110px; bottom: -150px; width: 420px; height: 420px; border-radius: 50%; background: var(--acc); opacity: .92; }
.side::before { content: ""; position: absolute; right: 22%; top: 38px; width: 58px; height: 58px; border-radius: 50%; background: var(--lime); }
.side > * { position: relative; z-index: 1; }
.pill { display: inline-flex; align-items: center; min-height: 30px; font-size: 12px; font-weight: 700; letter-spacing: .04em; color: #101114; background: var(--lime); padding: 4px 14px; border-radius: 999px; margin-bottom: 22px; }
.side h2 { font-size: clamp(36px, 4vw, 52px); line-height: 1; font-weight: 700; letter-spacing: -.055em; margin-bottom: 16px; }
.side h2 span { color: var(--lime); }
.side p { color: #c3c5cf; font-size: 16px; max-width: 360px; }
.seats { display: flex; gap: 10px; margin-top: 32px; }
.seats i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255,255,255,.45); background: transparent; animation: seatfill 7s ease-in-out infinite; }
.seats i:last-child { animation-name: seatlime; }
.seats i:nth-child(2) { animation-delay: .5s; } .seats i:nth-child(3) { animation-delay: 1s; } .seats i:nth-child(4) { animation-delay: 1.5s; }
.seats i:nth-child(5) { animation-delay: 2s; } .seats i:nth-child(6) { animation-delay: 2.5s; } .seats i:nth-child(7) { animation-delay: 3s; }
@keyframes seatfill { 0%, 8% { background: transparent; border-color: rgba(255,255,255,.45); } 18%, 78% { background: #fff; border-color: #fff; } 90%, 100% { background: transparent; border-color: rgba(255,255,255,.45); } }
@keyframes seatlime { 0%, 8% { background: transparent; border-color: rgba(215,255,63,.5); } 18%, 78% { background: var(--lime); border-color: var(--lime); } 90%, 100% { background: transparent; border-color: rgba(215,255,63,.5); } }

/* form card */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 28px; padding: 32px 24px; align-self: center; transition: background .25s, border-color .25s; }
.card h1 { font-size: 30px; font-weight: 700; letter-spacing: -.04em; line-height: 1.1; margin-bottom: 6px; }
.card .sub { color: var(--muted); margin-bottom: 26px; }
.field { margin-bottom: 16px; }
label { display: block; font-size: 13.5px; font-weight: 600; color: var(--ink-2); margin-bottom: 7px; }
input { width: 100%; min-height: 52px; padding: 12px 16px; font-size: 16px; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 16px; outline: none; transition: border-color .15s; }
input::placeholder { color: var(--muted); opacity: .8; }
input:focus { border-color: var(--acc-text); }
.pw { position: relative; }
.pw input { padding-right: 70px; }
.pw button { position: absolute; right: 6px; top: 6px; height: 40px; padding: 0 12px; background: none; border: none; border-radius: 12px; color: var(--acc-text); font-weight: 700; font-size: 13.5px; cursor: pointer; }

.btn { display: inline-flex; align-items: center; justify-content: center; width: 100%; min-height: 54px; margin-top: 8px; padding: 14px 28px; border: none; border-radius: 16px; background: var(--hero); color: var(--on-hero); font-weight: 700; font-size: 16px; cursor: pointer; transition: transform .15s var(--ease), opacity .15s; }
.btn:hover { opacity: .92; transform: translateY(-2px); }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }

#message { min-height: 22px; margin-top: 14px; font-size: 14px; font-weight: 600; text-align: center; overflow-wrap: anywhere; }
#message.ok { color: var(--success); }
#message.err { color: var(--danger); }
.alt { margin-top: 22px; text-align: center; color: var(--muted); font-size: 14.5px; }
.alt a { color: var(--acc-text); font-weight: 700; text-decoration: none; }
.back { display: flex; justify-content: center; align-items: center; min-height: 44px; margin-top: 4px; color: var(--muted); font-size: 13.5px; text-decoration: none; }
.back:hover { color: var(--ink); }

/* mobile: hero panel on top, form card slides up over it */
.shell { width: min(1080px, 100% - 24px); gap: 0; padding-bottom: 28px; }
.side { display: block; padding: 28px 24px 84px; border-radius: 32px; }
.side::after { right: -90px; bottom: -120px; width: 280px; height: 280px; }
.side::before { right: 14%; top: 24px; width: 44px; height: 44px; }
.side .pill { margin-bottom: 16px; }
.side h2 { font-size: 40px; margin-bottom: 0; }
.side p { display: none; }
.seats { margin-top: 22px; }
.card { position: relative; z-index: 2; margin: -52px 10px 0; padding: 28px 22px 20px; border-radius: 30px; box-shadow: 0 -12px 40px -18px rgba(0,0,0,.55), 0 24px 50px -24px rgba(0,0,0,.5); }
.card h1 { font-size: 26px; }
.card .sub { margin-bottom: 22px; }

@media (min-width: 900px) {
    .shell { grid-template-columns: 1.05fr 1fr; gap: 24px; padding-top: 16px; }
    .side { padding: 52px 44px; border-radius: 36px; }
    .side::after { right: -110px; bottom: -150px; width: 420px; height: 420px; }
    .side::before { right: 22%; top: 38px; width: 58px; height: 58px; }
    .side .pill { margin-bottom: 22px; }
    .side h2 { font-size: clamp(36px, 4vw, 52px); margin-bottom: 16px; }
    .side p { display: block; }
    .seats { margin-top: 32px; }
    .card { margin: 0; padding: 44px 40px; border-radius: 28px; box-shadow: none; }
    .card h1 { font-size: 30px; }
    .top { padding: 12px max(20px, calc((100% - 1080px) / 2)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>

<body>

<div class="top">
    <a href="/" class="brand" aria-label="Zivo home">
        <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="5" r="2.2"/><circle cx="12" cy="5" r="2.2"/><circle cx="19" cy="5" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="5" cy="19" r="2.2"/><circle cx="12" cy="19" r="2.2"/><circle class="on" cx="19" cy="19" r="2.2"/></svg>
        <span class="wm"><span>zi</span><b>vo</b></span>
    </a>
    <button type="button" class="icon-btn" id="themeBtn" aria-label="Switch theme">
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
</div>

<main class="shell">

    <aside class="side" aria-hidden="true">
        <span class="pill">Group vehicle buying</span>
        <h2>More Buyers.<br><span>Better Deals.</span></h2>
        <p>Join a buying group, compare dealer quotes and buy your next car, bike or scooter for less.</p>
        <div class="seats"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </aside>

    <section class="card">
        <h1>Welcome back</h1>
        <p class="sub">Login to your Zivo account.</p>

        <form id="loginForm" novalidate>
            <div class="field">
                <label for="email">Email address</label>
                <input type="email" id="email" placeholder="you@example.com" autocomplete="email" inputmode="email" required>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <div class="pw">
                    <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
                    <button type="button" id="togglePw" aria-label="Show password">Show</button>
                </div>
            </div>

            <button type="submit" class="btn" id="loginBtn">Login</button>
            <p id="message" role="status" aria-live="polite"></p>
        </form>

        <p class="alt">New to Zivo? <a href="/register">Create account</a></p>
        <a href="/" class="back">← Back to home</a>
    </section>

</main>

<script>
(function () {
    const $ = id => document.getElementById(id);

    $("themeBtn").addEventListener("click", function () {
        const next = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", next);
        try { localStorage.setItem("ct-theme", next); } catch (e) {}
        const m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", next === "light" ? "#f4f2ed" : "#0b0c10");
    });

    $("togglePw").addEventListener("click", function () {
        const p = $("password"), show = p.type === "password";
        p.type = show ? "text" : "password";
        this.textContent = show ? "Hide" : "Show";
        this.setAttribute("aria-label", show ? "Hide password" : "Show password");
    });

    $("loginForm").addEventListener("submit", async function (e) {
        e.preventDefault();
        const email = $("email").value.trim();
        const password = $("password").value;
        const message = $("message");
        const button = $("loginBtn");

        if (!email || !password) {
            message.className = "err";
            message.textContent = "Please enter your email and password.";
            return;
        }

        button.disabled = true;
        button.textContent = "Logging in...";
        message.className = "";
        message.textContent = "";

        try {
            const response = await fetch("/api/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: email, password: password })
            });
            const result = await response.json();

            if (result.success) {
                message.className = "ok";
                message.textContent = "Login successful!";
                window.location.href = "/customer-dashboard";
                return;
            }
            message.className = "err";
            message.textContent = result.message || "Login failed.";
        } catch (error) {
            message.className = "err";
            message.textContent = "Server connection error.";
        }

        button.disabled = false;
        button.textContent = "Login";
    });
})();
</script>

</body>
</html>
